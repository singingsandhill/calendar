app:
  base-url: https://datedate.site

# 카카오 OAuth2 로그인 자격증명 (ADR common/security/0004).
# spring.security.oauth2.client.* 프로퍼티 방식은 @WebMvcTest 슬라이스에서
# OAuth2ClientWebSecurityAutoConfiguration 이 HttpSecurity 부재로 컨텍스트 로드를 깨뜨려,
# ClientRegistration 은 KakaoOAuth2ClientConfig 빈으로 직접 등록한다.
kakao:
  oauth2:
    # REST API 키. 미설정 시 더미로 부팅만 가능(로그인 버튼은 동작 안 함).
    client-id: ${KAKAO_CLIENT_ID:kakao-client-id-unset}
    client-secret: ${KAKAO_CLIENT_SECRET:kakao-client-secret-unset}

# SEO 외부 인증 토큰
# - Google: Search Console 발급 토큰. 기본값은 datedate.site 운영 토큰; 다른 도메인 배포 시 GOOGLE_SITE_VERIFICATION 으로 오버라이드.
# - Naver: searchadvisor.naver.com 발급 후 NAVER_SITE_VERIFICATION 으로 주입.
seo:
  google-site-verification: ${GOOGLE_SITE_VERIFICATION:YVK_KclWiLH24rqy7kAI9iNYSA5No9ljXbnSOvsQB4k}
  naver-site-verification: ${NAVER_SITE_VERIFICATION:}

# Google AdSense
# - client: 비어 있으면 adsbygoogle.js 스크립트 자체를 로드하지 않음.
# - slot-*: 비어 있으면 해당 ad-slot fragment 가 렌더되지 않음 (placeholder DOM 미노출).
# 슬롯 ID 는 AdSense 심사 통과 후 콘솔에서 발급. 통과 전엔 환경변수 미설정으로 둔다. # ${ADSENSE_CLIENT:ca-pub-7334667748813914}
adsense:
  client:
  slot-leaderboard: ${ADSENSE_SLOT_LEADERBOARD:}
  slot-infeed: ${ADSENSE_SLOT_INFEED:}
  slot-rectangle: ${ADSENSE_SLOT_RECTANGLE:}

# IndexNow (Bing/Yandex/Naver 호환) 능동 색인 통보
indexnow:
  enabled: ${INDEXNOW_ENABLED:false}
  key: 1dfcb4404e1d4f6fae3423fd163f97b8
  key-location: https://datedate.site/1dfcb4404e1d4f6fae3423fd163f97b8.txt
  host: datedate.site
  endpoint: https://api.indexnow.org/indexnow

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: datedate

  datasource:
    url: ${DB_URL}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  h2:
    console:
      # 기본 비활성 (ADR common/security/0006) — 운영에서 무인증 공개돼 있던 것을 차단.
      # 로컬 개발은 .env 에 H2_CONSOLE_ENABLED=true. nginx 의 /h2-console 404 가 2겹째 방어.
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  web:
    resources:
      cache:
        period: 604800
      static-locations: classpath:/static/
      chain:
        strategy:
          content:
            enabled: true
            paths: /**

  jackson:
    default-property-inclusion: always

  # 배포 시 SIGTERM 종료 계약 (ADR common/infrastructure/0001):
  # 스케줄러 종료 대기 25s < lifecycle 30s < compose stop_grace_period 60s.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # P0-4: 스케줄러 스레드 풀 분리 — 느린 트레이딩 루프가 캔들 동기화/요약 잡을 굶기지 않도록.
  task:
    scheduling:
      pool:
        size: 4
      shutdown:
        # 기본 false 면 컨텍스트 종료 시 shutdownNow() 가 실행 중 틱을 인터럽트한다 —
        # 주문 HTTP 후 DB 커밋 전 kill = 무기록 체결 창. 진행 중 틱의 완주를 기다린다.
        await-termination: true
        await-termination-period: 25s

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${STOCK_MAIL_USERNAME:}
    password: ${STOCK_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 배포 헬스 게이트 (ADR common/security/0006). 게이트는 /actuator/health/deploy 를 폴링한다.
# mail 인디케이터 금지 — 켜면 헬스 조회마다 smtp.gmail.com 실접속(게이트가 외부 SMTP 에 종속
# + healthcheck 주기마다 Gmail AUTH). 인디케이터는 화이트리스트 방식으로만 켠다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      group:
        deploy:
          include: db,ping,diskSpace
  health:
    defaults:
      enabled: false
    db:
      enabled: true
    ping:
      enabled: true
    diskspace:
      enabled: true

server:
  port: 8081
  # Boot 4 기본값이지만 배포 스크립트의 stop_grace_period 계약을 코드에 고정 (ADR common/infrastructure/0001)
  shutdown: graceful
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  servlet:
    session:
      cookie:
        # 교차 사이트 form POST 에 세션 쿠키 미전송 (ADR 0004: /api/** CSRF 유예의 전제).
        # 카카오 로그인 복귀는 top-level GET 이라 Lax 에서 정상.
        same-site: lax

runner:
  admin:
    username: ${RUNNER_ADMIN_USERNAME:admin}
    password: ${RUNNER_ADMIN_PASSWORD:admin123}

logging:
  level:
    me.singingsandhill.calendar: DEBUG
    org.hibernate.SQL: DEBUG
  # NOTE: logback-spring.xml 가 파일 회전(KST 기준)과 거래 이벤트 분리(stock-events.log)를 담당.
  # logging.file.name 은 더 이상 사용하지 않는다 (이전: logs/stock-trading.log).

# Trading Bot Configuration
trading:
  bithumb:
    base-url: https://api.bithumb.com
    access-key: ${BITHUMB_ACCESS_KEY:}
    secret-key: ${BITHUMB_SECRET_KEY:}
  bot:
    enabled: ${TRADING_BOT_ENABLED:false}
    # 운영 모드 (P0-1): LIVE / PAPER / BACKTEST. 기본값 PAPER — 실주문은 서버 환경변수
    # TRADING_BOT_MODE=LIVE 로만 명시적 opt-in (P1-8, ADR trading/modes/0002).
    mode: ${TRADING_BOT_MODE:PAPER}
    # 재시작 후 자동 시작 (ADR stock/modes/0005) — 기본 false. 오픈 포지션이 있으면 보호 전용 복구가 우선한다.
    auto-start: ${TRADING_BOT_AUTO_START:false}
    market: KRW-ADA
    max-positions: 2
    order-ratio: 0.25
    signal-cooldown-minutes: 30    # [P2-9] 10→30: 1분봉 과회전·수수료 churn 억제 (감사 권장 ≥60, PAPER 백테스트로 조정)
    min-holding-minutes: 30        # [P2-9] 15→30: 최소 보유 시간 상향
    # 캔들 보관 일수. 7일이면 지표 재계산·백테스트 지평이 1주라 신호 품질 분석이 불가능했다.
    # 1분봉 × 1시장 = 1,440행/일 → 90일 ≈ 129,600행 (H2 파일 증가분 20MB 미만).
    # ADR trading/infrastructure/0005.
    candle-retention-days: 90
    # 정체 포지션 시간청산 (ADR trading/risk/0003, strategy/0011). maxHold 를 넘긴 이익 포지션 처리 — BREAKEVEN_CLOSE(현행, 즉시 청산) /
    # TIGHTEN_TRAIL(청산 대신 트레일링 즉시 활성화) / SIGNAL_GATED(최신 신호 점수 <= 0 일 때만 청산). 값은 리플레이(작업 6-A)로 정한다.
    max-hold-minutes: 360
    time-exit-mode: BREAKEVEN_CLOSE
    # 손실 포지션 시간청산 — maxHold 경과 + 손익률 >= 이 값(음수 비율)이면 청산. 키 없음(기본) = 비활성.
    # time-exit-loss-threshold: -0.005
  indicators:
    ma-short: 5
    ma-mid: 20
    ma-long: 60
    rsi-period: 14
    stoch-k: 14
    stoch-d: 3
    stoch-slow: 3
    volume-ma: 20
  thresholds:
    signal-buy: 40        # [FIX] 30→40: 사이클 매매 유지하면서 가짜 신호 필터링
    signal-sell: -40      # [FIX] -30→-40: 매도 신호도 동일 상향
    min-agreeing-indicators: 3  # 최소 3개 지표 합의 필요
    ma-convergence-threshold: 0.002  # MA 수렴 임계값 (0.2% 미만이면 크로스 무시)
    rsi-oversold: 35
    rsi-overbought: 65
    stoch-oversold: 25
    stoch-overbought: 75
    buy-rsi-max: 70
    buy-stoch-k-max: 85
    sell-rsi-min: 30
    sell-stoch-k-min: 15
  risk:
    # [P1-1/P1-2] 출구 R:R 재보정 (ADA 기준 권장값). ⚠️ 기본 LIVE 반영 — PAPER 백테스트 후 확정 권장.
    stop-loss: -0.015     # [P1-1] -3%→-1.5%: TP +3% 와 1:2 R:R (손익분기 승률 83%→33%)
    take-profit: 0.03     # [P1-2] +15%→+3%: 1분봉 알트 인트라데이에서 실현 가능한 익절
    trailing-stop: 0.008  # [P1-2] -3%→-0.8%: 트레일링을 주 승자 출구로 (손익분기 floor 유지)
    trailing-activation: 0.015 # [P1-2] +10%→+1.5%: 의미있는 이익에서 트레일링 활성
    # [P1-9] 수수료율. Bithumb maker=taker=0.25%(limit 로는 못 줄임). 0.04% 쿠폰 보유 시 0.0004 로 설정.
    taker-fee-rate: 0.0025
    # [P1-8] 매도 게이트 순수 net 마진. 왕복 수수료/슬리피지는 PnL 계산에서 이미 차감(이중계상 제거).
    # 쿠폰(taker-fee-rate 0.0004) 적용 시 더 낮춰도 됨.
    min-profit-threshold: 0.001
    # [P0-2/#6] 서킷브레이커 — 연속 손실/일일 손실 한도 도달 시 신규 BUY 차단(청산은 허용).
    circuit-breaker-enabled: true
    max-consecutive-losses: 3
    max-daily-loss-pct: -0.05
    # 틱 하한 (ADR trading/strategy/0011) — 손절·트레일링이 호가 노이즈(N틱)보다 좁아지지 않게 하는 하한. 기본 ON, 0 = 끔.
    # ADA 290원(1틱 = 0.34%): 손절 -1.5% → -1.72%, 트레일링 0.8%(2.4틱) → 고점 - 5원.
    min-stop-ticks: 5
    min-trailing-ticks: 5
    # 손절 방식 — PERCENT(stop-loss) / ATR(-atr-multiplier x atr-bar-minutes 분 집계봉 ATR%, 계산 불가면 PERCENT). 틱 하한은 둘 다 적용.
    stop-mode: PERCENT
    atr-period: 14
    atr-multiplier: 2.0
    atr-bar-minutes: 15
  rebalancing:
    # 기본 OFF (ADR trading/risk/0007) — 수익 원천은 신호 매수→신호 매도뿐이고, 6/5 포지션화 뒤 리밸런싱은 손절 루프가
    # 됐다(10/11~10/20 진입 17건 -4,407원). 엔진은 비교 대상으로 남긴다. 재활성화는 2년 일봉 리플레이(작업 6-C)가
    # "KRW 보유"·"단순 보유"를 위험조정 수익(총수익÷MDD)으로 모두 이길 때만.
    enabled: false
    # 목표 비중 레짐 — DAILY(일봉 레짐, trading.regime.*) / MINUTE_MA60(레거시: 현재가 vs 1분봉 MA60=60분 평균)
    regime-source: DAILY
    # 엔진이 켜져 있을 때 REBALANCE 포지션은 장중 SL/TP/트레일링/시간청산 대신 이 비상 손절만 받는다(수수료차감 손익률)
    catastrophic-stop-pct: -0.15
    default-ratio: 0.50
    bull-ratio: 0.70
    bear-ratio: 0.30
    deviation-trigger: 0.10
    cooldown-minutes: 480              # [FIX] 4시간→8시간: 리밸런싱 빈도 감소
    min-order-amount: 5000.0           # 최소 주문 금액 (KRW)
    slippage-buffer: 0.005             # 0.5% 슬리피지 버퍼
    skip-when-data-insufficient: true  # MA60 데이터 부족 시 스킵
    min-sell-pnl-pct: 0.0             # [P1-4] -3%→0%: 리밸런싱 매도는 평균 손익 ≥ 0% 일 때만 (ADR-0003 정합, 적자 청산 방지)
  # 일봉 레짐 (ADR trading/risk/0007) — 종가 vs SMA(ma-days), MA±hysteresis-pct 밴드를 벗어나야 전환, 전환 후 min-days 유지.
  # 형성 중인 당일봉 제외, KST 00:05 이후 하루 1회 갱신. GET /api/trading/bot/status 의 regime.
  regime:
    ma-days: 20
    hysteresis-pct: 0.02
    min-days: 3
    # 신호 매수 필터 — OFF / BLOCK_BEAR(BEAR 면 신호 매수 차단) / SCALE_BEAR(BEAR 면 비중 x bear-size-multiplier).
    # 기본 OFF: 작업 6-B 리플레이에서 1/4~6/4 와 6/5 이후 두 구간 모두 나아질 때만 켠다. 진입에만 적용.
    filter-mode: ${TRADING_REGIME_FILTER_MODE:OFF}
    unknown-policy: BLOCK        # 필터가 켜져 있는데 레짐을 모르면 차단 (ALLOW 로 통과 가능)
    bear-size-multiplier: 0.5

# Stock Trading Bot Configuration (Gap & Pullback Strategy)
stock:
  kis:
    base-url: https://openapi.koreainvestment.com:9443
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    account-number: ${KIS_ACCOUNT_NUMBER:}
    account-product-code: "01"
    production: true
  mail:
    enabled: ${STOCK_MAIL_ENABLED:false}
    to: ${STOCK_MAIL_TO:}
  bot:
    enabled: ${STOCK_BOT_ENABLED:false}
    # 실주문은 명시적 opt-in: 서버 환경변수 STOCK_BOT_MODE=LIVE 로만 활성화 (ADR stock/modes/0002)
    mode: ${STOCK_BOT_MODE:PAPER}
    max-positions: 5
    max-position-size: 5000000
    # PAPER/BACKTEST 가상 예수금(원) — 거래일마다 이 금액에서 시작해 당일 SIM- 체결로 재계산 (ADR stock/modes/0004).
    # PAPER 가 실계좌 예수금(0원)을 읽어 51거래일 0체결이던 문제의 수정. LIVE 는 무시.
    paper-cash: ${STOCK_BOT_PAPER_CASH:10000000}
    # 재시작 후 자동 시작 (ADR stock/modes/0005) — 기본 false. 오픈 포지션이 있으면 보호 전용 복구가 우선한다.
    auto-start: ${STOCK_BOT_AUTO_START:false}
  paper:
    # PAPER 체결가를 요청가보다 이만큼(%) 불리하게 — 매수 올림·매도 내림 후 KRX 호가단위 반올림.
    # risk.slippage-buffer(0.002) 와 같은 비용 가정 (ADR stock/algorithm/0008, stock/modes/0004).
    slippage-percent: 0.2
  screening:
    min-gap-percent: 1.0
    max-gap-percent: 10.0
    min-market-cap: 100000000000
    min-trade-value: 500000000
    min-trade-strength: 100
    max-spread-percent: 0.3
    max-watchlist-size: 10
    floor-gap-percent: 0.5
    floor-trade-strength: 95
  scoring:
    enabled: true
    gap-weight: 30
    strength-weight: 25
    trade-value-weight: 20
    spread-weight: 15
    market-cap-weight: 10
    min-score-threshold: 40
    # 신호 팩터(갭 점수 + 체결강도 점수) 최소 합 — 유동성 팩터(최대 45점)만으로 총점 임계를
    # 넘기던 왜곡 차단 (ADR stock/algorithm/0008). min-candidates 강제 선정은 제거됨(키만 보존).
    signal-min-score: 25
    min-candidates: 3
  entry:
    high-threshold-percent: 1.5
    # 1.0~1.3% 얕은 풀백은 TP2(전고점 회복) 기대 이득이 비용 게이트(실효 0.43% + 시간감쇠
    # 최소수익)를 못 넘어 손절·본전만 가능 — 게이트를 넘을 수 있는 깊이부터 진입 (ADR algorithm/0009).
    pullback-min-percent: 1.5
    pullback-max-percent: 5.0
    bounce-threshold-percent: 0.2
    min-pullback-minutes: 3
    max-pullback-minutes: 15
    entry-min-strength: 100
    entry-min-imbalance: 1.0
    soft-entry-validation: true
    # 주문 단계 진입 실패(시세 불가·거래 불가·수량 0·예외) 후 같은 종목 재시도 간격과 최대 횟수 —
    # 도달하면 ENTRY_FAILED 로 그날 재시도를 멈춘다. ORDER_UNCONFIRMED 는 스윕이 판정하므로 세지 않는다
    # (ADR stock/infrastructure/0009).
    open-retry-interval-seconds: 30
    max-open-attempts: 3
  exit:
    tp1-percent: 5.0
    tp1-ratio: 0.5
    tp2-ratio: 0.6
    tp3-percent: 10.0
    # 최종청산 cron(StockTradingScheduler 0 20 11)과 동일해야 한다. 어긋나면 11:20 강제청산
    # 후에도 트레이딩 루프 가드가 열려 있어 재진입할 수 있다 (2026-07 드리프트 사고).
    final-exit-time: "11:20"
  risk:
    # 손절: 풀백저가 앵커(진입 근거 무효화 지점) + 진입가 대비 최대 손실 캡 (ADR stock/algorithm/0007).
    # stop-loss-percent 는 레거시 키 — 현재 손절 계산은 아래 두 값만 사용.
    stop-loss-percent: 5.0
    pullback-stop-buffer-percent: 1.0
    max-stop-loss-percent: 2.0
    # 3.8% 트레일은 진입가 +4.4% 위에서만 본전보다 위로 올라가 러너 기여가 0 에 수렴 —
    # +2.5% 부터 이익을 잠그도록 축소 (ADR algorithm/0009).
    trailing-stop-percent: 2.0
    position-size-ratio: 0.1
    time-decay-enabled: true
    min-profit-threshold-late: 0.001
  universe:
    # 항상 포함되는 핀 종목 (사용자 화이트리스트). 빈 배열이면 거래량순위 ∪ (미달 시) fallback-codes 만 사용.
    pinned: []
    # 정적 안전망 풀: KIS 거래량순위(rank-api-top)가 요청한 top-N 에 미달하면 합집합으로 보강한다.
    # 갭 + 풀백 전략은 강세 모멘텀 종목에서만 작동하므로 변동성 높은 종목 위주 구성.
    fallback-codes:
