    # KIS 거래량순위(FHPST01710000) 상위 N 을 그날의 동적 유니버스로 사용. 0 이면 비활성(폴백만).
    rank-api-top: 30
    # 스크리닝에서 뺄 상품 유형(STOCK/ETF/ETN, KIS 증권그룹 scty_grp_id_cd). 기본 빈 목록 — ETF·ETN 제외는 데이터가 반대
    # 방향이라 보류(ETF·ETN n=16 +0.75% vs 개별주 n=123 -0.64%), PAPER 체결 100건 이상 쌓이면 일일 리포트 유형별 분해로 재평가
    # (ADR stock/algorithm/0011). 유형을 모르는 종목은 빼지 않는다.
    excluded-product-types: []
  trading:
    pre-market-start: "08:30"
    market-open: "09:00"
    # screening-end 는 의미가 모호해 호환용으로만 보존. 트레이딩 루프 가드는 trading-loop-start 사용.
    screening-end: "09:20"
    # 트레이딩 루프 가드 시작 시각. 보통 스크리닝 cron(StockTradingScheduler 의 0 20 9) 와 동일.
    trading-loop-start: "09:20"
    trading-end: "11:30"
    polling-interval-seconds: 5
    # KRX 휴일 (yyyy-MM-dd). 비워두면 주말만 거래 휴일. 평일 휴장일만 적는다(주말은 cron 이 차단).
    # 출처: 관공서 공휴일·대체공휴일 = 우주항공청 월력요항(2026-06-29 발표, 천문연 데이터) +
    #   거래소 고유 휴장 = 노동절(5/1)·연말 휴장(12/31)·선거일·제헌절(거래소 2026-05-20 공지).
    # 연말 휴장(12/31)은 관례 — 매년 12월 거래소 공고로 재확인. 2028 년분은 2027 년 말에 추가.
