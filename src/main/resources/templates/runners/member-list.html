<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko" th:with="extraStylesheets=${ {'/css/runners.css'} }">
<head th:replace="~{fragments/head :: head(${seo})}"></head>
<body class="runners-body">
    <nav th:replace="~{runners/fragments/header :: navbar}"></nav>

    <main class="runners-container">
        <section class="runners-member-list">
            <div class="runners-section-header">
                <h1>출석 현황</h1>
                <p class="runners-section-subtitle" th:text="'총 ' + ${members.size()} + '명의 러너'">총 N명의 러너</p>
            </div>

            <form method="get" th:action="@{/runners/members}" class="runners-filter-form"
                  th:classappend="${filterFrom != null or filterTo != null} ? 'active'">
                <div class="runners-form-group">
                    <label for="from">시작일</label>
                    <input type="date" id="from" name="from"
                           class="runners-input runners-filter-input" th:value="${filterFrom}">
                </div>
                <div class="runners-form-group">
                    <label for="to">종료일</label>
                    <input type="date" id="to" name="to"
                           class="runners-input runners-filter-input" th:value="${filterTo}">
                </div>
                <button type="submit" class="runners-btn runners-btn-primary runners-btn-sm">적용</button>
                <a th:href="@{/runners/members}" class="runners-filter-reset"
                   th:if="${filterFrom != null or filterTo != null}">전체 보기 ✕</a>
            </form>

            <div class="runners-member-table-wrapper" th:if="${!members.isEmpty()}">
                <table class="runners-member-table">
                    <thead>
                        <tr>
                            <th scope="col" class="rank">#</th>
                            <th scope="col" class="name">이름</th>
                            <th scope="col" class="regular">정규런</th>
                            <th scope="col" class="lightning">번개런</th>
                            <th scope="col" class="total">합계</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="member, stat : ${members}">
                            <td class="rank">
                                <span class="runners-ranking-position"
                                      th:classappend="${stat.index == 0 ? 'gold' : (stat.index == 1 ? 'silver' : (stat.index == 2 ? 'bronze' : 'regular'))}"
                                      th:text="${stat.index + 1}">1</span>
                            </td>
                            <td class="name">
                                <a th:href="@{/runners/members/{name}(name=${member.name()})}"
                                   class="runners-member-link"
                                   th:text="${member.name()}">러너</a>
                            </td>
                            <td class="regular" th:text="${member.regularCount()} + '회'">0회</td>
                            <td class="lightning" th:text="${member.lightningCount()} + '회'">0회</td>
                            <td class="total" th:text="${member.totalCount()} + '회'">0회</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="runners-empty" th:if="${members.isEmpty()}">
                <div class="runners-empty-icon">👥</div>
                <p th:text="${filterFrom != null or filterTo != null} ? '해당 기간에 출석 기록이 없습니다' : '아직 출석 기록이 없습니다'">아직 출석 기록이 없습니다</p>
            </div>
        </section>
    </main>

    <footer th:replace="~{runners/fragments/footer :: footer}"></footer>
</body>
</html>
