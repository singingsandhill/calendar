<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(${seo})}"></head>
<body>
<div th:replace="~{fragments/gtm-noscript :: gtm-noscript}"></div>
<div th:replace="~{fragments/header :: [th:fragment='header-minimal']}"></div>

<main class="container guides-page">
    <article class="guides-article">
        <header class="guides-hero animate-on-scroll">
            <h1 th:text="#{guides.article.scheduling-etiquette.title}">약속 에티켓</h1>
            <p class="guides-byline">
                <span th:text="#{guides.byline.published}">게시</span>
                <time th:attr="datetime=${article.published()}"
                      th:text="${#temporals.format(article.published(), #messages.msg('guides.byline.dateFormat'))}">2026</time>
                <span class="guides-byline-sep">·</span>
                <span th:text="#{guides.byline.updated}">수정</span>
                <time th:attr="datetime=${article.modified()}"
                      th:text="${#temporals.format(article.modified(), #messages.msg('guides.byline.dateFormat'))}">2026</time>
                <span class="guides-byline-sep">·</span>
                <span th:text="#{guides.byline.author}">DateDate 팀</span>
            </p>
        </header>

        <section class="animate-on-scroll">
            <p th:text="#{guides.article.scheduling-etiquette.lead.p1}">Lead p1</p>
            <p th:text="#{guides.article.scheduling-etiquette.lead.p2}">Lead p2</p>
        </section>

        <section class="animate-on-scroll">
            <h2 th:text="#{guides.article.scheduling-etiquette.s1.title}">제안의 매너</h2>
            <p th:text="#{guides.article.scheduling-etiquette.s1.p1}">p1</p>
            <p th:text="#{guides.article.scheduling-etiquette.s1.p2}">p2</p>
        </section>

        <section class="animate-on-scroll">
            <h2 th:text="#{guides.article.scheduling-etiquette.s2.title}">응답의 매너</h2>
            <p th:text="#{guides.article.scheduling-etiquette.s2.p1}">p1</p>
            <p th:text="#{guides.article.scheduling-etiquette.s2.p2}">p2</p>
            <p th:text="#{guides.article.scheduling-etiquette.s2.p3}">p3</p>
        </section>

        <section class="animate-on-scroll">
            <h2 th:text="#{guides.article.scheduling-etiquette.s3.title}">변경의 매너</h2>
            <p th:text="#{guides.article.scheduling-etiquette.s3.p1}">p1</p>
            <p th:text="#{guides.article.scheduling-etiquette.s3.p2}">p2</p>
            <p th:text="#{guides.article.scheduling-etiquette.s3.p3}">p3</p>
        </section>

        <section class="animate-on-scroll">
            <h2 th:text="#{guides.article.scheduling-etiquette.s4.title}">취소의 매너</h2>
            <p th:text="#{guides.article.scheduling-etiquette.s4.p1}">p1</p>
            <p th:text="#{guides.article.scheduling-etiquette.s4.p2}">p2</p>
        </section>

        <!-- 로케일 분기 섹션 — ko: 회식·경조사·상견례 관례 / en: RSVP 문화 (병렬 집필, 번역 아님) -->
        <section class="animate-on-scroll">
            <h2 th:text="#{guides.article.scheduling-etiquette.s5.title}">격식 자리의 관례</h2>
            <p th:text="#{guides.article.scheduling-etiquette.s5.p1}">p1</p>
            <p th:text="#{guides.article.scheduling-etiquette.s5.p2}">p2</p>
            <p th:text="#{guides.article.scheduling-etiquette.s5.p3}">p3</p>
        </section>

        <!-- 특수 블록: 상황별 메시지 문구 템플릿 3종 (기사별 골격 차별화 요소) -->
        <section class="guides-checklist animate-on-scroll">
            <h2 th:text="#{guides.article.scheduling-etiquette.tpl.title}">메시지 문구</h2>
            <p th:text="#{guides.article.scheduling-etiquette.tpl.intro}">intro</p>
            <div class="guides-msg" th:each="i : ${#numbers.sequence(1, 3)}">
                <strong th:text="#{'guides.article.scheduling-etiquette.tpl' + ${i} + '.label'}">label</strong>
                <p th:text="#{'guides.article.scheduling-etiquette.tpl' + ${i} + '.text'}">text</p>
            </div>
        </section>

        <section class="animate-on-scroll">
            <h2 th:text="#{guides.faq.title}">자주 묻는 질문</h2>
            <div class="faq-list">
                <div class="faq-item" th:each="i : ${#numbers.sequence(1, 3)}">
                    <button class="faq-question" aria-expanded="false" th:attr="aria-controls='guides-faq-' + ${i}">
                        <span th:text="#{'guides.article.scheduling-etiquette.faq.q' + ${i}}">Q</span>
                        <span class="faq-toggle" aria-hidden="true">+</span>
                    </button>
                    <div class="faq-answer" th:attr="id='guides-faq-' + ${i}" role="region">
                        <p th:text="#{'guides.article.scheduling-etiquette.faq.a' + ${i}}">A</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="guides-takeaways animate-on-scroll">
            <h2 th:text="#{guides.article.scheduling-etiquette.takeaways.title}">핵심 요약</h2>
            <ul>
                <li th:each="i : ${#numbers.sequence(1, 4)}"
                    th:text="#{'guides.article.scheduling-etiquette.takeaways.item' + ${i}}">item</li>
            </ul>
        </section>
    </article>

    <!-- Ad slot — 본문 뒤, CTA 앞 -->
    <div th:replace="~{fragments/ad-slot :: infeed(${seo.adsEnabled()})}"></div>

    <section class="guides-cta animate-on-scroll">
        <h2 th:text="#{guides.cta.title}">CTA</h2>
        <p th:text="#{guides.cta.description}">Description</p>
        <div class="use-case-cta-buttons">
            <a th:href="${@localeLinks.href('/#start-form')}" class="btn-spring" th:text="#{guides.cta.start}">일정 만들기</a>
        </div>
    </section>

    <section class="guides-related animate-on-scroll" th:if="${allGuides.size() > 1}">
        <h2 th:text="#{guides.related.title}">다른 모임 노하우</h2>
        <ul class="guides-related-list">
            <th:block th:each="g : ${allGuides}">
                <li th:if="${g.slug() != article.slug()}">
                    <a th:href="${@localeLinks.href('/guides/' + g.slug())}"
                       th:text="#{'guides.article.' + ${g.slug()} + '.title'}">Title</a>
                </li>
            </th:block>
        </ul>
    </section>
</main>

<div th:replace="~{fragments/footer :: [th:fragment='footer-minimal']}"></div>

<script>
// FAQ 토글 (guide.html / index.html 과 동일 메커니즘 — 전역 .faq-item.open CSS 사용)
document.querySelectorAll('.faq-question').forEach(button => {
    button.addEventListener('click', () => {
        const faqItem = button.parentElement;
        const isOpen = faqItem.classList.toggle('open');
        button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
});
</script>
</body>
</html>
