<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(${seo})}"></head>
<body>
<div th:replace="~{fragments/gtm-noscript :: gtm-noscript}"></div>
<div th:replace="~{fragments/header :: [th:fragment='header-minimal']}"></div>

<main class="container guides-page">
    <article class="guides-article">
        <header class="guides-hero animate-on-scroll">
            <h1 th:text="#{guides.article.scheduling-methods-compared.title}">조율 방법 비교</h1>
            <p class="guides-byline">
                <span th:text="#{guides.byline.published}">게시</span>
                <time th:attr="datetime=${article.published()}"
                      th:text="${#temporals.format(article.published(), #messages.msg('guides.byline.dateFormat'))}">2026</time>
                <span class="guides-byline-sep">·</span>
                <span th:text="#{guides.byline.updated}">수정</span>
                <time th:attr="datetime=${article.modified()}"
                      th:text="${#temporals.format(article.modified(), #messages.msg('guides.byline.dateFormat'))}">2026</time>
                <span class="guides-byline-sep">·</span>
                <span th:text="#{guides.byline.author}">DateDate 팀</span>
            </p>
        </header>

        <section class="animate-on-scroll">
            <p th:text="#{guides.article.scheduling-methods-compared.lead.p1}">Lead p1</p>
            <p th:text="#{guides.article.scheduling-methods-compared.lead.p2}">Lead p2</p>
        </section>

        <!-- 특수 블록: 5×5 비교표 (기사별 골격 차별화 요소) -->
        <section class="animate-on-scroll">
            <h2 th:text="#{guides.article.scheduling-methods-compared.table.title}">한눈 비교</h2>
            <div class="guides-table-wrap">
                <table class="guides-table">
                    <thead>
                    <tr>
                        <th th:text="#{guides.article.scheduling-methods-compared.table.h1}">방법</th>
                        <th th:text="#{guides.article.scheduling-methods-compared.table.h2}">준비 비용</th>
                        <th th:text="#{guides.article.scheduling-methods-compared.table.h3}">응답 부담</th>
                        <th th:text="#{guides.article.scheduling-methods-compared.table.h4}">적정 인원</th>
                        <th th:text="#{guides.article.scheduling-methods-compared.table.h5}">익명성</th>
                        <th th:text="#{guides.article.scheduling-methods-compared.table.h6}">결과 가시성</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${#numbers.sequence(1, 5)}">
                        <th th:text="#{'guides.article.scheduling-methods-compared.table.r' + ${r} + '.name'}">방법</th>
                        <td th:each="c : ${#numbers.sequence(1, 5)}"
                            th:text="#{'guides.article.scheduling-methods-compared.table.r' + ${r} + '.c' + ${c}}">값</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="animate-on-scroll" th:each="m : ${#numbers.sequence(1, 5)}">
            <h2 th:text="#{'guides.article.scheduling-methods-compared.m' + ${m} + '.title'}">방법</h2>
            <p th:text="#{'guides.article.scheduling-methods-compared.m' + ${m} + '.p1'}">p1</p>
            <p th:text="#{'guides.article.scheduling-methods-compared.m' + ${m} + '.p2'}">p2</p>
            <p><em th:text="#{'guides.article.scheduling-methods-compared.m' + ${m} + '.fit'}">fit</em></p>
        </section>

        <section class="animate-on-scroll">
            <h2 th:text="#{guides.article.scheduling-methods-compared.matrix.title}">무엇을 골라야 할까</h2>
            <p th:text="#{guides.article.scheduling-methods-compared.matrix.p1}">p1</p>
            <ul>
                <li th:each="i : ${#numbers.sequence(1, 4)}"
                    th:text="#{'guides.article.scheduling-methods-compared.matrix.li' + ${i}}">li</li>
            </ul>
            <p>
                <span th:text="#{guides.article.scheduling-methods-compared.matrix.p2}">p2</span>
                <a th:href="${@localeLinks.href('/guides/how-to-pick-a-date')}"
                   th:text="#{guides.article.scheduling-methods-compared.matrix.pickDateLink}">날짜 정하기 가이드 →</a>
            </p>
        </section>

        <section class="animate-on-scroll">
            <h2 th:text="#{guides.faq.title}">자주 묻는 질문</h2>
            <div class="faq-list">
                <div class="faq-item" th:each="i : ${#numbers.sequence(1, 3)}">
                    <button class="faq-question" aria-expanded="false" th:attr="aria-controls='guides-faq-' + ${i}">
                        <span th:text="#{'guides.article.scheduling-methods-compared.faq.q' + ${i}}">Q</span>
                        <span class="faq-toggle" aria-hidden="true">+</span>
                    </button>
                    <div class="faq-answer" th:attr="id='guides-faq-' + ${i}" role="region">
                        <p th:text="#{'guides.article.scheduling-methods-compared.faq.a' + ${i}}">A</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="guides-takeaways animate-on-scroll">
            <h2 th:text="#{guides.article.scheduling-methods-compared.takeaways.title}">핵심 요약</h2>
            <ul>
                <li th:each="i : ${#numbers.sequence(1, 4)}"
                    th:text="#{'guides.article.scheduling-methods-compared.takeaways.item' + ${i}}">item</li>
            </ul>
        </section>
    </article>

    <!-- Ad slot — 본문 뒤, CTA 앞 -->
    <div th:replace="~{fragments/ad-slot :: infeed(${seo.adsEnabled()})}"></div>

    <section class="guides-cta animate-on-scroll">
        <h2 th:text="#{guides.cta.title}">CTA</h2>
        <p th:text="#{guides.cta.description}">Description</p>
        <div class="use-case-cta-buttons">
            <a th:href="${@localeLinks.href('/#start-form')}" class="btn-spring" th:text="#{guides.cta.start}">일정 만들기</a>
        </div>
    </section>

    <section class="guides-related animate-on-scroll" th:if="${allGuides.size() > 1}">
        <h2 th:text="#{guides.related.title}">다른 모임 노하우</h2>
        <ul class="guides-related-list">
            <th:block th:each="g : ${allGuides}">
                <li th:if="${g.slug() != article.slug()}">
                    <a th:href="${@localeLinks.href('/guides/' + g.slug())}"
                       th:text="#{'guides.article.' + ${g.slug()} + '.title'}">Title</a>
                </li>
            </th:block>
        </ul>
    </section>
</main>

<div th:replace="~{fragments/footer :: [th:fragment='footer-minimal']}"></div>

<script>
// FAQ 토글 (guide.html / index.html 과 동일 메커니즘 — 전역 .faq-item.open CSS 사용)
document.querySelectorAll('.faq-question').forEach(button => {
    button.addEventListener('click', () => {
        const faqItem = button.parentElement;
        const isOpen = faqItem.classList.toggle('open');
        button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
});
</script>
</body>
</html>
