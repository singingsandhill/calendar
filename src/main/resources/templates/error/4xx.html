<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/error-head :: error-head(#{error.4xx.title})}"></head>
<body>
<div th:replace="~{fragments/gtm-noscript :: gtm-noscript}"></div>
<header>
    <nav class="navbar-minimal" role="navigation">
        <div class="navbar-content">
            <a th:href="@{/}" class="logo logo-serif">DateDate</a>
        </div>
    </nav>
</header>
<main class="container" style="text-align:center;padding:6rem 1rem;">
    <p style="font-size:5rem;color:var(--text-light);margin-bottom:1rem;font-weight:300;">404</p>
    <h1 style="margin-bottom:1rem;" th:text="#{error.4xx.heading}">페이지를 찾을 수 없어요</h1>
    <p style="color:var(--text-light);margin-bottom:2rem;" th:text="#{error.4xx.description}">
        요청하신 페이지가 존재하지 않거나 주소가 잘못되었습니다.
    </p>
    <a th:href="@{/}" class="btn-spring" style="display:inline-block;" th:text="#{error.4xx.home}">홈으로 돌아가기</a>
</main>
</body>
</html>
