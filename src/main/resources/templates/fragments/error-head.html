<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
  error-head(title) fragment — 에러 페이지(error/4xx·5xx) 전용 <head>.
  사용법: <head th:replace="~{fragments/error-head :: error-head(#{error.4xx.title})}"></head>

  공용 head(seo) 를 재사용하지 않는 이유: 에러 템플릿은 MvcExceptionHandler 외에
  Spring Boot 컨테이너 에러 경로(BasicErrorController 의 status 계열 뷰 해석)로도
  렌더링되는데, 그 경로에는 seo 모델 속성이 없어 무가드 ${seo.*()} 호출이 에러 렌더링
  자체를 실패시킨다. canonical/OG 는 에러 URL 에 무의미해 의도적으로 제외 —
  noindex·GTM 계측·비동기 폰트 패턴만 head.html 과 동기화해 유지한다.
-->
<head th:fragment="error-head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">DateDate</title>
    <meta name="robots" content="noindex">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <meta name="theme-color" content="#3498db">

    <!-- Google Tag Manager — head.html 의 JS 로더와 컨테이너 ID 일치 유지 -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PFPKQT7W');</script>
    <!-- End Google Tag Manager -->

    <!-- CSS (render-blocking, loaded first for no FOUC) -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Web Fonts — head.html 과 같은 비동기 패턴 (preload/onload + noscript) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
          as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
              rel="stylesheet">
    </noscript>
    <th:block th:if="${#locale.language == 'ko'}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preload"
              href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&display=swap"
              as="style" onload="this.onload=null;this.rel='stylesheet'">
        <noscript>
            <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&display=swap"
                  rel="stylesheet">
        </noscript>
    </th:block>
</head>

</html>
