<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
  scripts fragment — 캘린더/API/토스트 공통 스크립트 로딩.
  사용법: <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
-->
<th:block th:fragment="scripts">
    <!-- api.js 오류 문구 — 로케일별 메시지(api.error.*). api.js 보다 먼저 실행되도록 defer 없는 인라인 -->
    <script th:inline="javascript">
        window.API_ERROR_MESSAGES = {
            VALIDATION_ERROR: [[#{api.error.VALIDATION_ERROR}]],
            INVALID_ARGUMENT: [[#{api.error.INVALID_ARGUMENT}]],
            INVALID_OWNER_ID: [[#{api.error.INVALID_OWNER_ID}]],
            OWNER_NOT_FOUND: [[#{api.error.OWNER_NOT_FOUND}]],
            SCHEDULE_NOT_FOUND: [[#{api.error.SCHEDULE_NOT_FOUND}]],
            DUPLICATE_SCHEDULE: [[#{api.error.DUPLICATE_SCHEDULE}]],
            PARTICIPANT_NOT_FOUND: [[#{api.error.PARTICIPANT_NOT_FOUND}]],
            DUPLICATE_PARTICIPANT: [[#{api.error.DUPLICATE_PARTICIPANT}]],
            LOCATION_NOT_FOUND: [[#{api.error.LOCATION_NOT_FOUND}]],
            DUPLICATE_LOCATION: [[#{api.error.DUPLICATE_LOCATION}]],
            MENU_NOT_FOUND: [[#{api.error.MENU_NOT_FOUND}]],
            DUPLICATE_MENU: [[#{api.error.DUPLICATE_MENU}]],
            INTERNAL_ERROR: [[#{api.error.INTERNAL_ERROR}]],
            UNKNOWN: [[#{api.error.UNKNOWN}]]
        };
    </script>
    <script defer th:src="@{/js/toast.js}"></script>
    <script defer th:src="@{/js/api.js}"></script>
    <script defer th:src="@{/js/calendar.js}"></script>
</th:block>

</html>
