<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(${seo})}"></head>
<body>
<div th:replace="~{fragments/gtm-noscript :: gtm-noscript}"></div>
<div th:replace="~{fragments/header :: [th:fragment='header']}"></div>

<main class="mypage">
    <section class="mypage-profile">
        <img th:if="${profileImage != null}" th:src="${profileImage}" alt="" width="64" height="64"/>
        <h1 th:text="${nickname}">닉네임</h1>
        <a th:href="@{'/recap/' + ${currentYear}}" class="btn btn-primary mypage-recap-link"
           th:text="#{mypage.recap.link(${currentYear})}">2026 리캡 보러 가기</a>
    </section>

    <!-- 일정 페이지 카드 — 대시보드 일정 카드(.schedule-card) 스타일 재사용 -->
    <section class="mypage-owners">
        <h2 th:text="#{mypage.owners.title}">내 일정 페이지</h2>
        <div class="empty-state" th:if="${owners.isEmpty()}">
            <p th:text="#{mypage.owners.empty}">아직 연결된 페이지가 없어요.</p>
            <a th:href="${@localeLinks.href('/#start-form')}" class="btn btn-primary" th:text="#{nav.create}">일정 만들기</a>
        </div>
        <div class="schedules-grid" th:if="${!owners.isEmpty()}">
            <article class="schedule-card" th:each="owner : ${owners}">
                <header class="schedule-card-header">
                    <h3 th:text="${owner.ownerId}">my-crew</h3>
                </header>
                <div class="schedule-card-body">
                    <p th:text="#{mypage.owners.scheduleCount(${owner.scheduleCount})}">일정 2개</p>
                </div>
                <footer class="schedule-card-actions">
                    <a th:href="${@localeLinks.href('/' + owner.ownerId)}" class="btn btn-primary"
                       th:text="#{dashboard.card.view}">보기</a>
                </footer>
            </article>
        </div>
    </section>
</main>

<style>
    .mypage { max-width: 640px; margin: 0 auto; padding: 2rem 1rem; }
    .mypage-profile { text-align: center; margin-bottom: 2rem; }
    .mypage-profile img { border-radius: 50%; }
    .mypage-recap-link { margin-top: 0.75rem; }
    .mypage-owners h2 { margin-bottom: 1rem; }
</style>

<div th:replace="~{fragments/footer :: [th:fragment='footer']}"></div>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
