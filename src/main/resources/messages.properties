# ===== guides: how-to-pick-a-date (본문) =====
guides.article.how-to-pick-a-date.lead.p1=여섯 명이 모이는 저녁 약속 하나를 잡는 데 단톡방 메시지가 백 개 넘게 오간 경험, 한 번쯤 있을 겁니다. 날짜 잡기가 유독 힘든 이유는 사람이 아니라 구조에 있습니다. 참여자가 한 명 늘 때마다 피해야 할 일정도 함께 늘어나서, 모두가 되는 날의 교집합은 인원이 늘수록 빠르게 좁아집니다. 다섯 명이 각자 한 달 중 스무 날쯤 시간이 된다고 해도, 다섯 명 모두가 겹치는 날은 몇 손가락에 꼽을 만큼만 남는 게 보통입니다.
guides.article.how-to-pick-a-date.lead.p2=그래서 날짜 정하기는 운이나 눈치가 아니라 설계의 문제입니다. 후보를 몇 개나 내놓을지, 어떤 순서로 좁혀갈지, 언제까지 답을 받고 무엇을 기준으로 확정할지를 미리 정해두면 같은 모임이라도 확정까지 걸리는 시간이 눈에 띄게 줄어듭니다. 이 글은 그 과정을 다섯 단계로 나눠 하나씩 살펴봅니다. 도구는 무엇이든 좋습니다 — 종이와 펜, 단톡방 공지, 스프레드시트, 일정 투표 서비스 어느 쪽이든 아래 원칙은 똑같이 적용됩니다.
guides.article.how-to-pick-a-date.s1.title=후보 날짜는 몇 개가 적당할까
guides.article.how-to-pick-a-date.s1.p1=후보가 두 개뿐이면 어느 쪽도 안 되는 사람이 나오는 순간 조율이 원점으로 돌아갑니다. 반대로 열다섯 개를 늘어놓으면 고르는 쪽이 지칩니다. 선택지가 많아질수록 응답이 늦어지고 대충 고르게 되는 현상은 소비자 심리학에서 흔히 선택 과부하라고 부르는 바로 그 패턴입니다.
guides.article.how-to-pick-a-date.s1.p2=실전에서 무난하게 작동하는 후보 개수는 그룹 크기에 따라 다릅니다.
guides.article.how-to-pick-a-date.s1.li1=3~5명 모임: 후보 4~6개. 교집합이 비교적 잘 나오는 규모라 너무 많이 열어둘 필요가 없습니다.
guides.article.how-to-pick-a-date.s1.li2=6~8명 모임: 후보 6~10개. 인원이 늘어난 만큼 겹치는 날이 귀해지므로 후보 폭을 넓혀야 답이 나옵니다.
guides.article.how-to-pick-a-date.s1.li3=구성 팁: 주중 저녁과 주말을 섞으세요. 직장인 중심이면 금요일 저녁과 토요일, 학생이 섞여 있으면 평일 오후도 후보에 넣을 가치가 있습니다.
guides.article.how-to-pick-a-date.s1.p3=참고로 DateDate 에 만들어진 일정들을 보면 모임당 평균 참여 인원은 3명이 되지 않습니다. 실제 모임 대부분이 소규모라는 뜻이고, 그 규모라면 후보 대여섯 개로 충분히 답이 나옵니다.
guides.article.how-to-pick-a-date.s1.statsLink=실제 이용 통계 보기 →
guides.article.how-to-pick-a-date.s2.title=기간을 먼저 정하고, 날짜는 나중에 좁힌다
guides.article.how-to-pick-a-date.s2.p1=처음부터 "그럼 30일 어때?"라고 특정일을 던지면 그날이 안 되는 사람은 거절만 하게 되고 대화가 끊깁니다. 순서를 바꿔 보세요. 먼저 "다음 달 중에 보자"처럼 기간에 합의하고, 다음으로 "둘째 주나 셋째 주 주말"처럼 후보 주를 고르고, 마지막에 구체적인 후보일을 꺼내는 3단계입니다. 단계마다 답하기 쉬운 질문이라 응답률이 올라가고, 앞 단계의 합의가 뒷 단계의 범위를 좁혀 줍니다.
guides.article.how-to-pick-a-date.s2.p2=후보일을 꺼내는 시점과 모임일 사이의 간격, 즉 리드타임도 모임 성격에 맞춰야 합니다. 너무 촉박하면 이미 일정이 찬 사람이 많고, 너무 이르면 "그때 가봐야 안다"는 답이 돌아옵니다.
guides.article.how-to-pick-a-date.s2.li1=평일 저녁 식사: 1~2주 전
guides.article.how-to-pick-a-date.s2.li2=주말 모임·행사: 3~4주 전
guides.article.how-to-pick-a-date.s2.li3=1박 이상 여행: 6~8주 전 — 숙소와 교통편 예약이 걸려 있어 가장 여유가 필요합니다
guides.article.how-to-pick-a-date.s3.title=마감 없는 투표는 끝나지 않는다
guides.article.how-to-pick-a-date.s3.p1=후보를 공유할 때 가장 자주 빠지는 것이 답변 마감입니다. "되는 날 알려줘"라고만 하면 절반은 즉시 답하고 절반은 잊어버립니다. "수요일 밤까지 골라 주세요"처럼 마감을 함께 말하는 것만으로 응답 속도가 달라집니다. 마감은 재촉이 아니라 모두의 시간을 아끼는 약속입니다. 마감 길이는 후보를 공유한 시점부터 2~3일이 적당합니다. 하루는 너무 짧아 야근이나 출장 중인 사람을 놓치고, 일주일은 긴장이 풀려 잊어버리기 좋습니다.
guides.article.how-to-pick-a-date.s3.p2=마감이 지나면 무엇을 기준으로 확정할지도 미리 정해 두세요. 세 가지 방식이 있습니다. 전원이 가능한 날만 고르는 전원 일치 방식은 소규모 모임에 알맞고, 가장 많은 사람이 되는 날을 고르는 다수결 방식은 인원이 많을 때 현실적입니다. 생일이나 송별회, 상견례처럼 주인공이 있는 모임이라면 핵심 인원이 되는 날을 먼저 고정하고 나머지 인원의 가능 여부는 참고로만 쓰는 것이 맞습니다.
guides.article.how-to-pick-a-date.s3.p3=어느 방식이든 시작할 때 "가장 많이 겹치는 날로 정할게"라고 규칙을 공지해 두면 확정 뒤의 불만이 줄어듭니다. 규칙이 먼저 있으면 결과는 규칙의 산물이고, 규칙이 없으면 결과는 주최자의 독단으로 보이기 때문입니다.
guides.article.how-to-pick-a-date.s4.title=겹치는 날이 하나도 없을 때
guides.article.how-to-pick-a-date.s4.p1=성실하게 모아도 전원이 되는 날이 없는 경우는 생각보다 흔합니다. 이때 쓸 수 있는 카드는 세 장입니다.
guides.article.how-to-pick-a-date.s4.li1=범위 재확장: 기간을 다음 달까지 넓히거나, 평일 저녁처럼 처음에 빼놓았던 시간대를 후보에 추가합니다. 처음 정한 기간은 수단이지 목적이 아닙니다.
guides.article.how-to-pick-a-date.s4.li2=분할 모임: 인원이 많고 목적이 친목이라면 두 번으로 나누는 것도 답입니다. 여덟 명이 한 번에 모일 날을 두 달 기다리는 것보다 네 명씩 두 번 모이는 쪽이 만족도가 높을 때가 많습니다.
guides.article.how-to-pick-a-date.s4.li3=차선일 확정: 한 명만 안 되는 날이 있다면 그 사람에게 먼저 양해를 구하고 차선일로 확정합니다. 이때 불참자를 다음 모임 날짜 선정에서 최우선으로 배려한다는 규칙을 함께 두면 서운함이 쌓이지 않습니다.
guides.article.how-to-pick-a-date.s4.p2=피해야 할 것은 결정을 미루는 것입니다. "더 기다려 보자"는 대개 아무 날도 확정하지 못한 채 모임 자체가 흐지부지되는 길입니다. 조율이 2주를 넘기면 참여 열기부터 식습니다. 완벽한 날짜보다 확정된 날짜가 낫다는 것을 주최자가 먼저 받아들여야 모임이 성사됩니다.
guides.article.how-to-pick-a-date.s5.title=확정한 다음이 절반이다
guides.article.how-to-pick-a-date.s5.p1=날짜가 정해졌으면 그 자리에서 확정 공지를 하세요. "9월 13일 토요일 저녁으로 확정!"처럼 요일과 날짜를 함께 적으면 착오가 줄어듭니다. 각자 캘린더에 등록하도록 권하고, 장소가 정해져 있다면 함께 적습니다.
guides.article.how-to-pick-a-date.s5.p2=그리고 모임 일주일 전(D-7)과 전날(D-1)에 한 번씩 리마인드를 보냅니다. 두 번이면 충분합니다. 확정 이후의 리마인드는 참석률을 지키는 가장 값싼 장치이고, 특히 3주 이상 전에 확정한 모임이라면 없어서는 안 됩니다.
guides.article.how-to-pick-a-date.checklist.title=모임 날짜 선정 7단계 체크리스트
guides.article.how-to-pick-a-date.checklist.item1=모임 성격에 맞는 기간을 먼저 합의한다 ("다음 달 중", "9월 둘째~셋째 주"처럼)
guides.article.how-to-pick-a-date.checklist.item2=리드타임을 확인한다 — 저녁 약속 1~2주, 주말 모임 3~4주, 여행 6~8주
guides.article.how-to-pick-a-date.checklist.item3=그룹 크기에 맞춰 후보를 낸다 — 3~5명은 4~6개, 6~8명은 6~10개, 주중·주말 섞기
guides.article.how-to-pick-a-date.checklist.item4=답변 마감을 함께 공지한다 (요일과 시각까지)
guides.article.how-to-pick-a-date.checklist.item5=확정 기준을 미리 선언한다 — 전원 일치 / 최다 가능 / 핵심 인원 우선
guides.article.how-to-pick-a-date.checklist.item6=겹치는 날이 없으면 범위 확장·분할 모임·차선일 중에서 고른다
guides.article.how-to-pick-a-date.checklist.item7=확정 즉시 공지하고 D-7, D-1 리마인드를 예약한다
guides.article.how-to-pick-a-date.faq.q1=후보 날짜를 너무 많이 내면 왜 안 되나요?
guides.article.how-to-pick-a-date.faq.a1=선택지가 많을수록 응답자는 비교에 드는 품이 커져 답을 미루게 되고, 표가 갈라져 최다 득표일조차 과반이 안 되는 경우가 많아집니다. 그룹 크기에 맞춰 4~10개 사이로 제한하는 쪽이 확정까지 빠릅니다.
guides.article.how-to-pick-a-date.faq.q2=일부만 답하고 나머지가 무응답이면 어떻게 하나요?
guides.article.how-to-pick-a-date.faq.a2=마감을 한 번 연장하며 개인적으로 다시 물어보되, 두 번째 마감이 지나면 응답자만으로 확정하는 것이 관례입니다. 시작할 때 "마감까지 답이 없으면 되는 걸로 볼게"라고 기본값을 공지해 두면 갈등 없이 진행할 수 있습니다.
guides.article.how-to-pick-a-date.faq.q3=몇 명부터 투표 도구를 쓰는 게 나을까요?
guides.article.how-to-pick-a-date.faq.a3=경험적으로 4명부터는 단톡방 대화만으로 교집합을 추적하기 어려워집니다. 후보일을 표로 정리해 각자 되는 날을 표시하게 하면 — 종이든 스프레드시트든 DateDate 같은 도구든 — 대화가 흩어지지 않고 결과가 한눈에 남습니다.
guides.article.how-to-pick-a-date.takeaways.title=핵심 요약
guides.article.how-to-pick-a-date.takeaways.item1=후보 개수는 그룹 크기에 비례해 4~10개 — 너무 적으면 원점, 너무 많으면 과부하
guides.article.how-to-pick-a-date.takeaways.item2=기간 → 후보 주 → 후보일 순서로 좁히고, 모임 성격에 맞는 리드타임을 지킨다
guides.article.how-to-pick-a-date.takeaways.item3=마감과 확정 기준을 시작할 때 공지한다 — 규칙이 먼저면 결과에 대한 불만이 준다
guides.article.how-to-pick-a-date.takeaways.item4=확정 후 D-7·D-1 리마인드까지가 날짜 정하기다

# ===== guides: scheduling-methods-compared (SEO + 본문) =====
guides.article.scheduling-methods-compared.title=모임 일정 조율 방법 5가지 비교 — 단톡 투표부터 전용 도구까지
guides.article.scheduling-methods-compared.metaTitle=모임 일정 조율 방법 5가지 비교
guides.article.scheduling-methods-compared.navLabel=조율 방법 비교
guides.article.scheduling-methods-compared.summary=단톡방 투표, 공유 스프레드시트, 공유 캘린더, 일정 투표 도구, 리더 단독 결정 — 다섯 가지 일정 조율 방법의 준비 비용과 응답 부담, 적정 인원을 비교표로 정리하고 모임 크기와 격식에 따라 무엇을 골라야 하는지 알려드립니다.
guides.article.scheduling-methods-compared.keywords=일정 조율 방법, 약속 잡기 앱 비교, 단톡방 투표, 모임 날짜 도구
guides.article.scheduling-methods-compared.lead.p1=모임 날짜를 정하는 방법은 생각보다 여러 가지입니다. 단톡방에 투표를 올리는 집, 스프레드시트를 돌리는 집, 리더가 그냥 정해버리는 집 — 어느 쪽이든 굴러는 갑니다. 문제는 모임의 크기와 성격에 안 맞는 방법을 골랐을 때입니다. 세 명 저녁 약속에 스프레드시트는 과하고, 열 명 워크숍을 단톡방 채팅만으로 잡으려 하면 누가 되는지 아무도 모르는 채 대화만 쌓입니다.
guides.article.scheduling-methods-compared.lead.p2=이 글은 실제로 많이 쓰이는 다섯 가지 방법을 같은 기준으로 나란히 놓고 비교합니다. 각 방법이 어떻게 굴러가는지, 어디까지 감당되는지, 어떤 모임에 맞는지를 확인하고 나면 우리 모임에 맞는 방법을 고르는 일이 훨씬 단순해집니다.
