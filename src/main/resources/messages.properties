seo.home.description=링크 하나로 모임 날짜, 장소, 메뉴까지 한 번에 정하는 무료 그룹 일정 조율 서비스입니다. 가입·설치 없이 링크만 공유하면 참여자들이 가능한 날짜를 고르고 장소와 메뉴 투표까지 끝낼 수 있어 친구 모임, 팀 회의, 여행, 스터디 약속을 빠르게 확정할 수 있습니다.
seo.home.keywords=약속 잡기, 일정 조율, 날짜 선택, 그룹 스케줄링, 캘린더, 모임 일정, date picker, scheduling, 회의 일정
