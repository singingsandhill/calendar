seo.about.title=DateDate 소개 | 그룹 일정 조율 서비스
seo.about.description=DateDate가 어떤 서비스이고 데이터를 어떻게 다루는지 안내합니다. 가입 없이 링크 하나로 날짜·장소·메뉴를 정하는 그룹 일정 조율 도구의 동작 방식과 데이터 보관 원칙, 광고 운영 기준, 문의 연락처까지 운영에 관한 내용을 한 페이지에서 확인하세요.
seo.about.keywords=DateDate 소개, 그룹 일정 조율, 약속 잡기 서비스, 회사 소개, 운영 원칙
seo.about.ogTitle=DateDate 소개
