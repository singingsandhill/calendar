# ===== guides: how-to-pick-a-date (body) =====
guides.article.how-to-pick-a-date.lead.p1=If you have ever watched a hundred messages fly around a group chat just to schedule one dinner, you already know the problem. Picking a date is hard for structural reasons, not personal ones: every person you add brings a calendar of conflicts, so the set of days everyone can make shrinks fast. Five people who are each free twenty days a month may share only a handful of dates - and eight people often share none at all.
guides.article.how-to-pick-a-date.lead.p2=That is why picking a date works better as a designed process than as a guessing game. Decide in advance how many options to offer, in what order to narrow them down, when answers are due, and what rule confirms the final date. This guide walks through that process in five steps and ends with a checklist you can reuse for any group event.
guides.article.how-to-pick-a-date.s1.title=How many candidate dates should you offer?
guides.article.how-to-pick-a-date.s1.p1=Offer two dates and the whole plan collapses the moment one person can make neither of them. Offer fifteen and people stall: long lists slow everyone down and invite careless answers, the classic choice-overload effect that shows up in every study of decision fatigue. Somewhere between those extremes is a sweet spot, and it depends on the size of your group.
guides.article.how-to-pick-a-date.s1.p2=These ranges hold up well in practice.
guides.article.how-to-pick-a-date.s1.li1=3-5 people: 4-6 candidate dates. Overlap is still easy to find at this size, so a short list keeps things quick.
guides.article.how-to-pick-a-date.s1.li2=6-8 people: 6-10 candidate dates. Shared free days get rare as the group grows, so you need a wider net before a common date appears.
guides.article.how-to-pick-a-date.s1.li3=Mix weekday evenings and weekends. An office crowd leans toward Friday night and Saturday; if students are involved, weekday afternoons are worth including too.
guides.article.how-to-pick-a-date.s1.p3=For what it is worth, events created on DateDate average fewer than three participants each - most real-world plans are small, and for a group that size five or six options is usually plenty.
guides.article.how-to-pick-a-date.s1.statsLink=See the live usage stats →
guides.article.how-to-pick-a-date.s2.title=Agree on a window first, then narrow to a day
guides.article.how-to-pick-a-date.s2.p1=Opening with a specific date - "how about the 30th?" - forces anyone who is busy that day into a flat no, and the thread dies there. Reverse the order. First agree on a window ("sometime next month"), then on a week ("the second or third weekend"), and only then put concrete dates on the table. Each step is an easy question to answer, so response rates go up, and each agreement narrows the range for the next step.
guides.article.how-to-pick-a-date.s2.p2=Lead time matters just as much: send options too late and calendars are already full, too early and everyone answers "ask me closer to the date." Match the lead time to the kind of plan.
guides.article.how-to-pick-a-date.s2.li1=Weeknight dinner: 1-2 weeks ahead
guides.article.how-to-pick-a-date.s2.li2=Weekend gathering or event: 3-4 weeks ahead
guides.article.how-to-pick-a-date.s2.li3=Overnight trip: 6-8 weeks ahead - lodging and transport bookings need the most runway
guides.article.how-to-pick-a-date.s3.title=A poll without a deadline never closes
guides.article.how-to-pick-a-date.s3.p1=The single most common mistake is sharing options with no reply deadline. Say "let me know which days work" and half the group answers right away while the other half forgets. Say "pick your dates by Wednesday night" and response speed changes immediately. A deadline is not nagging - it is a courtesy that protects everyone's time, including the time of the people who answered promptly.
guides.article.how-to-pick-a-date.s3.p2=Decide the confirmation rule before the deadline passes, not after. There are three workable rules. Unanimity - only dates everyone can make - suits small groups. Majority - the date the most people can make - is realistic for larger ones. And when the event has a guest of honor, like a birthday, a farewell, or a family introduction, lock in the key people first and treat everyone else's availability as advisory.
guides.article.how-to-pick-a-date.s3.p3=Whichever rule you choose, announce it up front: "we will go with the date the most people can make." A rule declared in advance makes the outcome feel fair; a rule invented afterwards makes it look like the organizer's whim, even when the choice is identical.
guides.article.how-to-pick-a-date.s4.title=When no date works for everyone
guides.article.how-to-pick-a-date.s4.p1=Sometimes you do everything right and the overlap is still empty. That is not a failure - it is a common outcome once a group passes five or six people. You have three cards to play.
guides.article.how-to-pick-a-date.s4.li1=Widen the range: extend into next month, or add time slots you excluded at the start, such as weekday evenings. The original window was a tool, not the goal.
guides.article.how-to-pick-a-date.s4.li2=Split the event: if the point is catching up, two smaller gatherings often beat one full-attendance dinner that takes two months to schedule.
guides.article.how-to-pick-a-date.s4.li3=Confirm the second-best date: if exactly one person is blocked, ask for their blessing, confirm the date, and give them first pick for the next gathering so the goodwill balances out.
guides.article.how-to-pick-a-date.s4.p2=The one move to avoid is waiting. "Let us give it more time" is usually how a plan quietly dies with no date at all.
guides.article.how-to-pick-a-date.s5.title=Confirming the date is only half the job
guides.article.how-to-pick-a-date.s5.p1=Once the date is settled, announce it immediately and unambiguously - "Confirmed: Saturday, September 13, 7pm" - with the weekday spelled out to prevent mix-ups between similar dates. Ask everyone to put it on their calendar on the spot, and include the venue if one is already booked.
guides.article.how-to-pick-a-date.s5.p2=Then send exactly two reminders: one a week out and one the day before. Reminders are the cheapest attendance insurance there is, and for anything confirmed more than three weeks in advance they are not optional - by then the plan has faded from everyone's mental calendar.
guides.article.how-to-pick-a-date.checklist.title=The 7-step date-picking checklist
guides.article.how-to-pick-a-date.checklist.item1=Agree on a window that fits the occasion ("sometime next month," "the second or third week of September")
guides.article.how-to-pick-a-date.checklist.item2=Check the lead time - 1-2 weeks for dinners, 3-4 weeks for weekend plans, 6-8 weeks for trips
guides.article.how-to-pick-a-date.checklist.item3=Offer options sized to the group - 4-6 dates for 3-5 people, 6-10 for 6-8 people, mixing weekdays and weekends
guides.article.how-to-pick-a-date.checklist.item4=Announce a reply deadline, down to the day and hour
guides.article.how-to-pick-a-date.checklist.item5=Declare the confirmation rule up front - unanimity, majority, or key people first
guides.article.how-to-pick-a-date.checklist.item6=If nothing overlaps: widen the range, split the event, or confirm the second-best date
guides.article.how-to-pick-a-date.checklist.item7=Announce the confirmed date at once, then remind at D-7 and D-1
guides.article.how-to-pick-a-date.faq.q1=Why not just offer every possible date?
guides.article.how-to-pick-a-date.faq.a1=Because long lists slow people down and scatter the votes - with fifteen options, even the most popular date rarely clears half the group. Keeping the list between four and ten, sized to your group, gets you to a confirmed date faster.
guides.article.how-to-pick-a-date.faq.q2=What do I do about people who never respond?
guides.article.how-to-pick-a-date.faq.a2=Extend the deadline once and ask them directly. After a second deadline passes, the accepted convention is to confirm with the people who answered. Announcing the default up front - "no reply by Friday counts as free" - avoids the awkwardness entirely.
guides.article.how-to-pick-a-date.faq.q3=At what group size is a scheduling poll worth it?
guides.article.how-to-pick-a-date.faq.a3=In practice, from about four people the group chat stops being a reliable place to track who can make what. Putting the candidate dates in one shared view - a spreadsheet, a poll tool, or DateDate - keeps the answers from scattering across the conversation.
guides.article.how-to-pick-a-date.takeaways.title=Key takeaways
guides.article.how-to-pick-a-date.takeaways.item1=Size the option list to the group: 4-10 candidates, mixing weekdays and weekends
guides.article.how-to-pick-a-date.takeaways.item2=Narrow window → week → day, and respect the lead time the occasion needs
guides.article.how-to-pick-a-date.takeaways.item3=Declare the deadline and the confirmation rule before anyone votes
guides.article.how-to-pick-a-date.takeaways.item4=The job ends at the D-7 and D-1 reminders, not at the confirmation message

# ===== guides: scheduling-methods-compared (SEO + body) =====
guides.article.scheduling-methods-compared.title=5 Ways to Schedule a Group Meetup, Compared
guides.article.scheduling-methods-compared.navLabel=Methods Compared
guides.article.scheduling-methods-compared.summary=Group-chat polls, shared spreadsheets, shared calendars, scheduling poll tools, or one decider - five ways to pick a date, compared by setup cost and effort.
guides.article.scheduling-methods-compared.keywords=group scheduling methods, when2meet vs doodle, group chat poll, shared calendar scheduling
guides.article.scheduling-methods-compared.lead.p1=There are more ways to pick a date than most groups realize. Some drop a poll into the group chat, some pass around a spreadsheet, some let one person decree the day. All of them work - until the method stops matching the group. A spreadsheet for a three-person dinner is overkill; scheduling a ten-person workshop through chat messages alone means nobody ever quite knows who can make what.
guides.article.scheduling-methods-compared.lead.p2=This article puts the five most common methods side by side under the same criteria: how each one works, how much it can handle, and which kind of plan it suits. Once you see them in one table, choosing becomes the easy part.
