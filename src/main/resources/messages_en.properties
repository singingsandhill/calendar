seo.useCase.study-group.exampleId=coding-study
seo.useCase.study-group.step1.name=Create a study schedule page
seo.useCase.study-group.step1.text=Go to datedate.site, enter a study ID (e.g., java-study), and click Get Started.
seo.useCase.study-group.step2.name=Share the link with study members
seo.useCase.study-group.step2.text=Share the generated link with your study group. No install or login — members join the schedule instantly.
seo.useCase.study-group.step3.name=Coordinate recurring meetup dates
seo.useCase.study-group.step3.text=When members pick their available dates, common dates appear automatically. You can also agree on a venue and study topic.
seo.useCase.club-activity.title=Club & Hobby Group Scheduling
seo.useCase.club-activity.description=Coordinate recurring club activities and see who's coming each session. For tennis, hiking, futsal, or board games, track attendance before booking the venue.
seo.useCase.club-activity.body=A club isn't a one-off plan — it's a standing group where members come and go. Your roster may list 15 people, but only 6-10 actually show up each week, and it changes every time. With one DateDate link, members tap the dates they can make and attendance is tallied per session. Sports clubs (tennis, futsal, badminton) can size court bookings; outings (hiking, camping) can find the weekend that works. Settle the venue, court, and after-party in the same screen, and reuse the page each month to keep the activity going. No sign-up, no install.
