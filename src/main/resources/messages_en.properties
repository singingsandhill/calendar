seo.useCase.team-meeting.sample.body=Reuse a team-sprint page each month, changing only the month and year. When 7 teammates mark their availability for the next sprint review, Wednesday rises as the most-overlapping day. Last month's roster carries over, so there's nothing to re-enter.
seo.useCase.travel-planning.sample.title=How it works — a trip-planning example
seo.useCase.travel-planning.sample.body=On a japan-trip page, four friends each tap their whole available vacation window. The second week of May (Thu to Sun) overlaps for all four, narrowing the start of a 3-night trip automatically. Settle lodging and route options with the menu vote.
seo.useCase.study-group.sample.title=How it works — a study-group example
seo.useCase.study-group.sample.body=On a coding-study page, keep the weekly session and pre-exam make-up candidates together. Saturday morning, open for 4 of 5 members, becomes the regular slot; a make-up is added only when enough can attend. Track progress and the presenter in the schedule description.
seo.useCase.club-activity.sample.title=How it works — a club example
