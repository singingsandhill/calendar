seo.useCase.study-group.sample.title=How it works — a study-group example
seo.useCase.study-group.sample.body=On a coding-study page, keep the weekly session and pre-exam make-up candidates together. Saturday morning, open for 4 of 5 members, becomes the regular slot; a make-up is added only when enough can attend. Track progress and the presenter in the schedule description.
seo.useCase.club-activity.sample.title=How it works — a club example
