seo.useCase.club-activity.step2.name=Share the link with members
seo.useCase.club-activity.step2.text=Share the link in your club chat, band, or cafe. No install or sign-up — any member marks their attendance instantly.
seo.useCase.club-activity.step3.name=Check attendance for this session
seo.useCase.club-activity.step3.text=When members tap their available dates, attendance is tallied per session, so you can size court, field, or venue bookings in advance.
