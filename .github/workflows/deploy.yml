# 수동 배포 — workflow_dispatch 버튼으로만 서버 반영 (ADR common/infrastructure/0001)
# 실계좌 LIVE 봇 서버: 배포마다 봇 재시작(보호전용 자동재개)·서킷브레이커 카운터 리셋이
# 발생하므로 자동 배포하지 않는다.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 이미지 태그 (40자 git SHA 권장, latest 는 서버에서 다이제스트로 고정됨)'
        required: true
        default: ''
      force:
        description: '주식 봇 시간창(평일 09:15-11:25 KST) 가드 우회'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      # 입력·시크릿은 절대 셸 문자열에 직접 보간하지 않는다 (커맨드 인젝션) — env 매핑 + 인용 + 정규식 검증.
      IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
      FORCE: ${{ inputs.force && '--force' || '' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^([0-9a-f]{40}|latest)$ ]]; then
            echo "invalid image_tag: $IMAGE_TAG (40-hex git sha or 'latest')"; exit 1
          fi

      - name: Verify image exists in GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker manifest inspect "ghcr.io/${{ github.repository_owner }}/calendar:$IMAGE_TAG" > /dev/null

      - name: Set up SSH keys
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RSYNC_KEY: ${{ secrets.DEPLOY_SSH_RSYNC_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY"  > ~/.ssh/deploy_key  && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$RSYNC_KEY"   > ~/.ssh/rsync_key   && chmod 600 ~/.ssh/rsync_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Sync deploy bundle
        # rsync 키는 서버에서 rrsync -wo 로 ~/apps/calendar 하위 쓰기 전용으로 제한됨.
        # 불변식: --delete 는 deploy/ 하위에만. ~/apps/calendar 루트를 --delete 대상으로 삼는
        # rsync 는 금지 — data/·logs/·.env·.deploy/ 가 그 층위에 산다 (docs/operations/deployment.md).
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/rsync_key -p $DEPLOY_PORT" \
            deploy/ "$DEPLOY_USER@$DEPLOY_HOST":deploy/
          rsync -az -e "ssh -i ~/.ssh/rsync_key -p $DEPLOY_PORT" \
            deploy/compose.yaml "$DEPLOY_USER@$DEPLOY_HOST":compose.yaml

      - name: Run remote deploy
        # 실행 키는 서버 forced-command 게이트가 "deploy <tag> [--force]" 만 허용.
        # deploy.sh 종료코드가 곧 잡 결과 — 롤백 성공(3)도 실패로 표기해 조사를 유도한다.
        run: |
          CMD="deploy $IMAGE_TAG"
          if [[ -n "$FORCE" ]]; then CMD="$CMD $FORCE"; fi   # 트레일링 스페이스 금지 — 게이트 정규식이 정확 일치
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$CMD"
