# CI — 빌드+테스트(main 푸시·PR) + main 푸시 시 GHCR 이미지 발행 (ADR common/infrastructure/0001)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # PR 코드가 Gradle 빌드 스크립트로 임의 실행되는 잡 — 쓰기 권한 금지
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint deploy scripts
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/server/calendar-deploy-gate.sh
          shellcheck -S warning deploy/deploy.sh deploy/server/calendar-deploy-gate.sh
      - name: Build & test
        run: ./gradlew build
      - name: Upload jar for image job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/calendar-0.0.1-SNAPSHOT.jar
          retention-days: 1

  push-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/calendar:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/calendar:latest
