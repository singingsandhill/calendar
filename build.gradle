plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'me.singingsandhill'
version = '0.0.1-SNAPSHOT'
description = 'making appointment'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	// 배포 헬스 게이트 (/actuator/health/deploy) — ADR common/security/0006
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	// 카카오 OAuth2 로그인 (ADR common/security/0004)
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// Trading Bot Dependencies
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'com.auth0:java-jwt:4.4.0'

	// Mail
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// JSON (SelectionListConverter 등 직접 사용)
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// P0-2/v2 마이그레이션: WebClient 타임아웃→client_order_id 재조회 정합화 경로 결정적 테스트용
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		// 오프라인 리플레이는 운영 DB 사본·공개 API 가 필요해 기본 test 에서 뺀다 (ADR trading/observability/0005)
		excludeTags 'replay'
	}
}

// 코인 리플레이 6-A·6-B·6-C: ./gradlew replay -Dreplay.db=<scheduledb 사본> — 보고서는 docs/data-analysis/coin-*-replay-<날짜>.md
tasks.register('replay', Test) {
	description = 'Offline coin replay (exit / regime filter / rebalancing) over a production DB copy'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'replay'
	}
	System.properties.each { key, value ->
		if (key.toString().startsWith('replay.')) {
			systemProperty key.toString(), value
		}
	}
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
		events 'passed', 'skipped', 'failed'
	}
}

springBoot {
	buildInfo()
}
