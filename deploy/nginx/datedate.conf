# datedate.site 리버스 프록시 (ADR common/infrastructure/0002)
# 호스트 nginx sites-enabled/datedate 의 3개 server block 의미를 보존하고 4가지를 추가한다:
# ACME webroot / 503 유지보수 / h2-console·actuator 엣지 차단 / Docker DNS 재해석.
# ⚠️ 런북 7단계에서 전환 전 `nginx -T` 덤프와 기계적 대조 필수 (TLS 등급·헤더 계약 유지).

server_tokens build;

# ① HTTP → HTTPS (ACME 챌린지만 예외 — 호스트 certbot 이 /var/www/certbot 에 쓴다)
server {
    listen 80;
    server_name datedate.site www.datedate.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://datedate.site$request_uri;
    }
}

# ② www → non-www (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name www.datedate.site;

    ssl_certificate /etc/letsencrypt/live/datedate.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datedate.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    return 301 https://datedate.site$request_uri;
}

# ③ 메인 (HTTPS non-www)
server {
    listen 443 ssl;
    http2 on;
    server_name datedate.site;

    ssl_certificate /etc/letsencrypt/live/datedate.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datedate.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # 호스트 nginx.conf http 블록의 gzip 설정 이관 (앱 압축과 별개로 프록시 응답 보완)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Docker 내장 DNS 재해석 — 변수 없는 proxy_pass 는 기동 시 1회만 해석해 app 컨테이너가
    # 재생성되면 죽은 IP 로 영구 502 를 낸다. 변수 경유 + resolver 로 매 요청 재해석.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 관리 표면 엣지 차단 (ADR common/security/0006) — 404 로 존재 자체 은닉.
    # h2-console 은 앱 레벨 기본 비활성(1겹) + 여기(2겹). 관리자는 ssh -L 8081 터널로 접근.
    location ^~ /h2-console {
        return 404;
    }
    # actuator health 는 배포 게이트(서버 내 localhost:8081) 전용 — 외부 완전 비노출.
    location ^~ /actuator {
        return 404;
    }

    location / {
        set $app_upstream app:8081;
        proxy_pass http://$app_upstream;
        # X-Forwarded 계약 보존 — 카카오 로그인 redirect_uri 가 Proto/Host 에 의존 (KOE006),
        # 앱은 forward-headers-strategy: native. 호스트 nginx 의 5개 헤더 전부 유지.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # 재시작 배포 중 업스트림 다운 → 503 유지보수 페이지.
        # `=503` 명시가 핵심 — 미지정이면 정적 파일의 200 이 그대로 나가 크롤러가
        # 점검 페이지를 정상 콘텐츠로 색인한다 (SEO 오염).
        error_page 502 503 504 =503 /maintenance.html;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html/maintenance;
        add_header Retry-After 120 always;   # 재시작 1~3분 계약 — 크롤러 재방문 힌트
        internal;                            # 평시 직접 접근은 404
    }
}
